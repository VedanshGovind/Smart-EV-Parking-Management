{# small line icons (24x24, stroke based) #}
{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'dashboard' -%}
    <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/>
{%- elif name == 'parking' -%}
    <rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9.5 17V7.5h3.2a3 3 0 0 1 0 6H9.5"/>
{%- elif name == 'charging' -%}
    <polygon points="13 2 4 14 12 14 11 22 20 10 12 10 13 2"/>
{%- elif name == 'waitlist' -%}
    <circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>
{%- elif name == 'invoices' -%}
    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><polyline points="14 3 14 8 19 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/>
{%- elif name == 'bell' -%}
    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>
{%- elif name == 'collapse' -%}
    <polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/>
{%- elif name == 'check' -%}
    <circle cx="12" cy="12" r="9"/><polyline points="8.5 12.5 11 15 15.5 9.5"/>
{%- elif name == 'tick' -%}
    <polyline points="20 6 9 17 4 12"/>
{%- elif name == 'lock' -%}
    <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
{%- elif name == 'list' -%}
    <line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>
{%- elif name == 'close' -%}
    <line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>
{%- elif name == 'chevron' -%}
    <polyline points="6 9 12 15 18 9"/>
{%- elif name == 'logout' -%}
    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
{%- elif name == 'user' -%}
    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
{%- elif name == 'eye' -%}
    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
{%- elif name == 'eye-off' -%}
    <path d="M17.9 17.9A10.1 10.1 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.2 3.2m-6.7-1.1a3 3 0 1 1-4.2-4.2"/><line x1="1" y1="1" x2="23" y2="23"/>
{%- elif name == 'car' -%}
    <path d="M3 13l2-5a2 2 0 0 1 1.9-1.4h10.2A2 2 0 0 1 19 8l2 5v4a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H6v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><circle cx="7.5" cy="13.5" r="1"/><circle cx="16.5" cy="13.5" r="1"/>
{%- elif name == 'clock' -%}
    <circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>
{%- elif name == 'rupee' -%}
    <path d="M6 4h12M6 9h12M9 4c4 0 6 2 6 5s-2 5-6 5l7 6"/>
{%- endif -%}
</svg>
{%- endmacro %}
